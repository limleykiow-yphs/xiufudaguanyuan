<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>玩家安全登录与云端读取测试</title>

  <style>
    body {
      font-family: "Microsoft YaHei", Arial, sans-serif;
      background: #f6efe3;
      margin: 0;
      padding: 40px 16px;
      color: #4b342b;
    }

    .box {
      max-width: 560px;
      margin: auto;
      background: #fffaf2;
      border: 1px solid #e6cfaa;
      border-radius: 18px;
      padding: 26px;
      box-shadow: 0 10px 30px rgba(80, 50, 30, .12);
    }

    h1 {
      margin-top: 0;
      color: #8e3840;
      font-size: 26px;
    }

    h2 {
      margin-top: 24px;
      font-size: 20px;
      color: #6e4b3c;
    }

    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 6px;
      font-weight: 700;
    }

    select,
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #cdbb9d;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      border: 0;
      border-radius: 10px;
      background: #8e3840;
      color: white;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .result {
      margin-top: 20px;
      padding: 14px;
      border-radius: 10px;
      display: none;
      line-height: 1.8;
    }

    .success {
      display: block !important;
      background: #e6f5e2;
      color: #315b31;
      border: 1px solid #9ac794;
    }

    .error {
      display: block !important;
      background: #fde7e7;
      color: #8b2f2f;
      border: 1px solid #e3aaaa;
    }

    .info {
      display: block !important;
      background: #eef4fb;
      color: #304d6b;
      border: 1px solid #b7cae0;
    }

    .progress-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }

    .progress-item {
      background: rgba(255,255,255,.7);
      border: 1px solid #cfd8c9;
      border-radius: 8px;
      padding: 10px;
    }

    .note {
      margin-top: 18px;
      font-size: 13px;
      color: #77685a;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>玩家安全登录与云端读取测试</h1>

    <p>
      此页面用于测试：
      <strong>服务器验证 PIN → 签发 token → 使用 token 安全读取玩家自己的云端进度</strong>。
    </p>

    <label for="role">身份</label>

    <select id="role">
      <option value="student">学生</option>
      <option value="staff">教职员</option>
    </select>

    <label for="externalId">学号／编号</label>

    <input
      id="externalId"
      type="text"
      autocomplete="off"
      placeholder="例如：2024127"
    >

    <label for="pin">4 位 PIN</label>

    <input
      id="pin"
      type="password"
      inputmode="numeric"
      maxlength="4"
      autocomplete="off"
      placeholder="请输入 4 位 PIN"
    >

    <button id="testBtn">
      登录并读取云端进度
    </button>

    <div id="loginResult" class="result"></div>

    <div id="progressResult" class="result"></div>

    <div class="note">
      本测试页只读取资料，不会修改分数、金币或答题进度。
      测试完成后可删除。
    </div>

  </div>


<script>

const roleEl =
  document.getElementById("role");

const externalIdEl =
  document.getElementById("externalId");

const pinEl =
  document.getElementById("pin");

const btn =
  document.getElementById("testBtn");

const loginResult =
  document.getElementById("loginResult");

const progressResult =
  document.getElementById("progressResult");


btn.addEventListener("click", async () => {

  const role =
    roleEl.value;

  const external_id =
    externalIdEl.value.trim();

  const pin =
    pinEl.value.trim();


  resetResult(
    loginResult
  );

  resetResult(
    progressResult
  );


  if (!external_id) {

    showError(
      loginResult,
      "❌ 请输入学号／编号。"
    );

    return;
  }


  if (!/^\d{4}$/.test(pin)) {

    showError(
      loginResult,
      "❌ PIN 必须是 4 位数字。"
    );

    return;
  }


  btn.disabled = true;

  btn.textContent =
    "正在验证并读取……";


  try {

    // ==================================================
    // STEP 1：安全登录
    // ==================================================

    const loginResponse =
      await fetch(
        "/api/player-login",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            role,
            external_id,
            pin
          })
        }
      );


    const loginData =
      await loginResponse.json();


    if (
      !loginResponse.ok ||
      !loginData.ok
    ) {

      throw new Error(
        loginData.message ||
        "登录验证失败"
      );
    }


    const token =
      loginData.token;


    if (!token) {

      throw new Error(
        "服务器没有返回玩家 token"
      );
    }


    const player =
      loginData.player || {};


    loginResult.className =
      "result success";

    loginResult.innerHTML =
      "✅ 玩家身份验证成功！" +
      "<br>" +
      "姓名：" +
      escapeHtml(
        player.name || ""
      ) +
      "<br>" +
      "身份：" +
      escapeHtml(
        player.role || ""
      ) +
      "<br>" +
      "学号／编号：" +
      escapeHtml(
        player.external_id || ""
      );


    // ==================================================
    // STEP 2：使用 token 安全读取云端进度
    // ==================================================

    const progressResponse =
      await fetch(
        "/api/load-progress",
        {
          method: "GET",

          headers: {
            "Authorization":
              "Bearer " + token
          }
        }
      );


    const progressData =
      await progressResponse.json();


    if (
      !progressResponse.ok ||
      !progressData.ok
    ) {

      throw new Error(
        progressData.message ||
        "读取云端进度失败"
      );
    }


    const p =
      progressData.progress || {};


    const completedCount =
      countCompleted(
        p.completed
      );


    progressResult.className =
      "result info";


    progressResult.innerHTML =
      "<h2>✅ 云端进度读取成功</h2>" +

      "<div class='progress-grid'>" +

        progressBox(
          "分数",
          numberValue(p.score)
        ) +

        progressBox(
          "金币",
          numberValue(p.coins)
        ) +

        progressBox(
          "答对",
          numberValue(p.correct)
        ) +

        progressBox(
          "答错",
          numberValue(p.wrong)
        ) +

        progressBox(
          "已作答",
          numberValue(p.answered)
        ) +

        progressBox(
          "当前连击",
          numberValue(p.combo)
        ) +

        progressBox(
          "最高连击",
          numberValue(p.best_combo)
        ) +

        progressBox(
          "已完成景点",
          completedCount + " / 15"
        ) +

      "</div>" +

      (
        p.updated_at
          ? "<br>云端最后更新时间：" +
            escapeHtml(
              formatTime(
                p.updated_at
              )
            )
          : ""
      ) +

      "<br><br>" +

      "服务器已根据登录 token 自动确认玩家身份，" +
      "没有使用浏览器提供的 player_id。";


  } catch (error) {

    showError(
      progressResult,
      "❌ " +
      (
        error.message ||
        "测试失败"
      )
    );

  } finally {

    btn.disabled = false;

    btn.textContent =
      "登录并读取云端进度";

    // 测试结束后立即清空 PIN
    pinEl.value = "";
  }

});


// ==================================================
// Helper functions
// ==================================================

function resetResult(el) {
  el.className = "result";
  el.style.display = "none";
  el.innerHTML = "";
}


function showError(el, text) {
  el.className =
    "result error";

  el.textContent = text;
}


function numberValue(value) {
  const n = Number(value);

  return Number.isFinite(n)
    ? n
    : 0;
}


function progressBox(label, value) {

  return (
    "<div class='progress-item'>" +
      "<strong>" +
        escapeHtml(label) +
      "</strong>" +
      "<br>" +
      escapeHtml(value) +
    "</div>"
  );
}


function countCompleted(completed) {

  if (
    !completed ||
    typeof completed !== "object"
  ) {
    return 0;
  }

  return Object
    .values(completed)
    .filter(Boolean)
    .length;
}


function formatTime(value) {

  try {

    return new Date(value)
      .toLocaleString(
        "zh-MY",
        {
          timeZone:
            "Asia/Kuala_Lumpur"
        }
      );

  } catch {

    return String(value || "");
  }
}


function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

</script>

<!-- trigger secure load test -->

</body>
</html>
