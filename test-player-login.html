<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>玩家安全云端存档测试</title>

<style>
body{
  font-family:"Microsoft YaHei",Arial,sans-serif;
  background:#f6efe3;
  margin:0;
  padding:40px 16px;
  color:#4b342b;
}
.box{
  max-width:600px;
  margin:auto;
  background:#fffaf2;
  border:1px solid #e6cfaa;
  border-radius:18px;
  padding:26px;
  box-shadow:0 10px 30px rgba(80,50,30,.12);
}
h1{
  margin-top:0;
  color:#8e3840;
  font-size:26px;
}
label{
  display:block;
  margin-top:16px;
  margin-bottom:6px;
  font-weight:700;
}
select,input{
  width:100%;
  box-sizing:border-box;
  padding:12px;
  border:1px solid #cdbb9d;
  border-radius:10px;
  font-size:16px;
}
button{
  width:100%;
  margin-top:22px;
  padding:13px;
  border:0;
  border-radius:10px;
  background:#8e3840;
  color:white;
  font-size:17px;
  font-weight:700;
  cursor:pointer;
}
button:disabled{
  opacity:.55;
}
.result{
  margin-top:18px;
  padding:14px;
  border-radius:10px;
  display:none;
  line-height:1.7;
}
.success{
  display:block;
  background:#e6f5e2;
  border:1px solid #9ac794;
  color:#315b31;
}
.error{
  display:block;
  background:#fde7e7;
  border:1px solid #e3aaaa;
  color:#8b2f2f;
}
.info{
  display:block;
  background:#eef4fb;
  border:1px solid #b7cae0;
  color:#304d6b;
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:10px;
}
.item{
  padding:9px;
  background:rgba(255,255,255,.7);
  border:1px solid #ccd5c6;
  border-radius:8px;
}
.note{
  margin-top:18px;
  font-size:13px;
  color:#77685a;
}
</style>
</head>

<body>

<div class="box">

<h1>玩家安全云端存档测试</h1>

<p>
测试流程：
<strong>
登录 → 安全读取 → 原样安全保存 → 再次读取 → 自动核对
</strong>
</p>

<p>
本测试不会故意增加或减少分数、金币或答题进度。
</p>

<label>身份</label>
<select id="role">
  <option value="student">学生</option>
  <option value="staff">教职员</option>
</select>

<label>学号／编号</label>
<input
  id="externalId"
  type="text"
  autocomplete="off"
  placeholder="例如：2024127"
>

<label>4 位 PIN</label>
<input
  id="pin"
  type="password"
  inputmode="numeric"
  maxlength="4"
  autocomplete="off"
  placeholder="请输入 4 位 PIN"
>

<button id="btn">
开始安全存档测试
</button>

<div id="loginResult" class="result"></div>
<div id="beforeResult" class="result"></div>
<div id="saveResult" class="result"></div>
<div id="afterResult" class="result"></div>

<div class="note">
PIN 在测试结束后会自动清空。
测试页面完成全部验证后即可删除。
</div>

</div>

<script>

const btn=document.getElementById("btn");

const loginResult=
document.getElementById("loginResult");

const beforeResult=
document.getElementById("beforeResult");

const saveResult=
document.getElementById("saveResult");

const afterResult=
document.getElementById("afterResult");


btn.addEventListener("click",async()=>{

  clearResults();

  const role=
  document.getElementById("role").value;

  const external_id=
  document.getElementById("externalId")
  .value.trim();

  const pin=
  document.getElementById("pin")
  .value.trim();


  if(!external_id){
    showError(loginResult,"❌ 请输入学号／编号");
    return;
  }

  if(!/^\d{4}$/.test(pin)){
    showError(loginResult,"❌ PIN 必须为 4 位数字");
    return;
  }


  btn.disabled=true;
  btn.textContent="正在测试……";


  try{

    // ============================================
    // 1. 登录
    // ============================================

    const loginResponse=
    await fetch("/api/player-login",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        role,
        external_id,
        pin
      })
    });


    const loginData=
    await loginResponse.json();


    if(!loginResponse.ok || !loginData.ok){
      throw new Error(
        loginData.message ||
        "玩家登录失败"
      );
    }


    const token=loginData.token;

    if(!token){
      throw new Error(
        "没有取得玩家登录 token"
      );
    }


    const player=
    loginData.player || {};


    loginResult.className=
    "result success";

    loginResult.innerHTML=
    "✅ 第 1 步：玩家登录验证成功"+
    "<br>姓名："+esc(player.name||"")+
    "<br>学号／编号："+esc(player.external_id||"");


    // ============================================
    // 2. 第一次安全读取
    // ============================================

    const before=
    await loadProgress(token);


    beforeResult.className=
    "result info";

    beforeResult.innerHTML=
    "<strong>✅ 第 2 步：保存前云端进度读取成功</strong>"+
    progressHtml(before);


    // ============================================
    // 3. 原样安全保存
    // ============================================

    const saveResponse=
    await fetch(
      "/api/save-progress-secure",
      {
        method:"POST",

        headers:{
          "Content-Type":
          "application/json",

          "Authorization":
          "Bearer "+token
        },

        body:JSON.stringify({

          score:
          num(before.score),

          coins:
          num(before.coins),

          correct:
          num(before.correct),

          wrong:
          num(before.wrong),

          answered:
          num(before.answered),

          combo:
          num(before.combo),

          best_combo:
          num(before.best_combo),

          completed:
          before.completed || {},

          stage_records:
          before.stage_records || {}

        })
      }
    );


    const saveData=
    await saveResponse.json();


    if(!saveResponse.ok || !saveData.ok){
      throw new Error(
        saveData.message ||
        "安全保存失败"
      );
    }


    saveResult.className=
    "result success";

    saveResult.innerHTML=
    "<strong>✅ 第 3 步：安全保存成功</strong>"+
    "<br>服务器根据登录 token 自动确认玩家身份。"+
    "<br>没有使用浏览器提供的 player_id。";


    // ============================================
    // 4. 再次安全读取
    // ============================================

    const after=
    await loadProgress(token);


    afterResult.className=
    "result info";

    afterResult.innerHTML=
    "<strong>✅ 第 4 步：保存后重新读取成功</strong>"+
    progressHtml(after);


    // ============================================
    // 5. 自动比较关键游戏数据
    // ============================================

    const same=
    compareProgress(before,after);


    if(same){

      afterResult.className=
      "result success";

      afterResult.innerHTML +=
      "<br><br>"+
      "<strong>"+
      "🎉 全部测试通过！"+
      "</strong>"+
      "<br>"+
      "保存前与保存后的游戏进度完全一致。";

    }else{

      afterResult.className=
      "result error";

      afterResult.innerHTML +=
      "<br><br>"+
      "<strong>"+
      "⚠️ 数据前后不一致，请停止后续修改。"+
      "</strong>";

    }


  }catch(error){

    showError(
      afterResult,
      "❌ "+(
        error.message ||
        "测试失败"
      )
    );

  }finally{

    document.getElementById("pin").value="";

    btn.disabled=false;

    btn.textContent=
    "开始安全存档测试";

  }

});


// ================================================
// 安全读取
// ================================================

async function loadProgress(token){

  const response=
  await fetch(
    "/api/load-progress",
    {
      method:"GET",

      headers:{
        "Authorization":
        "Bearer "+token
      }
    }
  );


  const data=
  await response.json();


  if(!response.ok || !data.ok){

    throw new Error(
      data.message ||
      "读取云端进度失败"
    );

  }


  return data.progress || {};
}


// ================================================
// 比较存档
// updated_at 不参与比较，因为保存后时间一定改变
// ================================================

function compareProgress(a,b){

  const fields=[
    "score",
    "coins",
    "correct",
    "wrong",
    "answered",
    "combo",
    "best_combo"
  ];


  for(const field of fields){

    if(
      num(a[field]) !==
      num(b[field])
    ){
      return false;
    }

  }


  if(
    stableStringify(a.completed || {}) !==
    stableStringify(b.completed || {})
  ){
    return false;
  }


  if(
    stableStringify(a.stage_records || {}) !==
    stableStringify(b.stage_records || {})
  ){
    return false;
  }


  return true;
}


// ================================================
// 稳定 JSON 比较
// ================================================

function stableStringify(value){

  if(value===null){
    return "null";
  }

  if(typeof value!=="object"){
    return JSON.stringify(value);
  }

  if(Array.isArray(value)){
    return "["+
      value.map(stableStringify).join(",")+
      "]";
  }

  const keys=
  Object.keys(value).sort();

  return "{"+
    keys.map(
      key=>
      JSON.stringify(key)+":"+
      stableStringify(value[key])
    ).join(",")+
    "}";
}


// ================================================
// 显示进度
// ================================================

function progressHtml(p){

  return (
    "<div class='grid'>"+

    item("分数",num(p.score))+
    item("金币",num(p.coins))+

    item("答对",num(p.correct))+
    item("答错",num(p.wrong))+

    item("已作答",num(p.answered))+
    item("当前连击",num(p.combo))+

    item(
      "最高连击",
      num(p.best_combo)
    )+

    item(
      "完成景点",
      countCompleted(p.completed)+
      " / 15"
    )+

    "</div>"
  );

}


function item(label,value){

  return (
    "<div class='item'>"+
    "<strong>"+esc(label)+"</strong>"+
    "<br>"+
    esc(value)+
    "</div>"
  );

}


function countCompleted(obj){

  if(!obj || typeof obj!=="object"){
    return 0;
  }

  return Object
  .values(obj)
  .filter(Boolean)
  .length;

}


function num(value){

  const n=Number(value);

  return Number.isFinite(n)
    ? n
    : 0;

}


function esc(value){

  return String(value)
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}


function showError(el,text){

  el.className="result error";
  el.textContent=text;

}


function clearResults(){

  [
    loginResult,
    beforeResult,
    saveResult,
    afterResult
  ].forEach(el=>{
    el.className="result";
    el.innerHTML="";
  });

}

</script>

<!-- secure save test -->

</body>
</html>
